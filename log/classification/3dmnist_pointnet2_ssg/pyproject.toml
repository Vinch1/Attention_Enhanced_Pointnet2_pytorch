[project]
name = "pointnet-pointnet2-pytorch"
version = "0.1.0"
description = "PointNet and PointNet++ implementation in PyTorch"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0",
    "numpy",
    "h5py>=3.10.0",
    "tqdm",
    "opencv-python>=4.13.0.92",
    "pillow>=10.4.0",
    "matplotlib>=3.7.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.uv]
# Cross-platform PyTorch installation
# This project supports:
# - macOS: Uses MPS (Metal Performance Shaders) on Apple Silicon, or CPU
# - Linux/Windows with NVIDIA GPU: Uses CUDA
# - CPU-only systems: Falls back to CPU

# Installation instructions:
#
# Using uv (recommended):
#   uv sync
#
# Using pip:
#   pip install torch numpy tqdm
#
# For macOS (Apple Silicon):
#   PyTorch 2.x automatically uses MPS when available
#   Use --use_cpu flag to force CPU mode if needed
#
# For CUDA (Linux/Windows):
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
#
# Run examples:
#   python train_classification.py --model pointnet_cls --use_cpu  # Force CPU
#   python train_classification.py --model pointnet_cls            # Auto-detect device
